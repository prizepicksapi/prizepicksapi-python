[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prizepicksapi"
version = "0.1.0"
description = "Python client for prizepicksapi.com: live PrizePicks lines, goblin and demon tiers, line history and graded results."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Stunning Couches LLC", email = "support@prizepicksapi.com" }]
keywords = ["prizepicks", "player props", "dfs", "pick'em", "sports data", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Repository = "https://github.com/prizepicksapi/prizepicksapi-python"
Issues = "https://github.com/prizepicksapi/prizepicksapi-python/issues"
Homepage = "https://prizepicksapi.com"
Documentation = "https://prizepicksapi.com/docs"
"API reference" = "https://prizepicksapi.com/openapi.json"
Pricing = "https://prizepicksapi.com/pricing"

[tool.setuptools.packages.find]
where = ["src"]
